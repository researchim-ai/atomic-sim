# Конфигурация по умолчанию для симулятора реактора

simulator:
  device: cpu
  dtype: float64
  dt: 0.001  # шаг времени (сек)

neutronics:
  Lambda: 5.0e-5  # время жизни нейтронов (сек)
  beta_groups: 6  # количество групп запаздывающих нейтронов
  P0: 100.0  # номинальная мощность (МВт)

thermal:
  C_fuel: 200.0  # теплоемкость топлива (МДж/К)
  C_clad: 20.0  # теплоемкость оболочки (МДж/К)
  C_coolant: 100.0  # теплоемкость теплоносителя (МДж/К)
  
  h1: 20.0  # коэффициент теплопередачи топливо-оболочка (МВт/К)
  h2: 30.0  # коэффициент теплопередачи оболочка-теплоноситель (МВт/К)
  h_flow: 100.0  # коэффициент потока (МВт/К)
  
  T_in: 280.0  # температура входа (°C)
  flow_rate_nominal: 1.0  # номинальный расход
  
  alpha_fuel: -5.0e-5  # температурный коэффициент топлива (Δρ/β)/K
  alpha_coolant: -3.0e-5  # температурный коэффициент теплоносителя (Δρ/β)/K
  
  # Пределы безопасности
  T_fuel_max: 1200.0  # максимальная температура топлива (°C)
  T_coolant_max: 320.0  # максимальная температура теплоносителя (°C)

control:
  n_rods: 10  # количество управляющих стержней
  rod_worth: -2.0  # ценность одного стержня (β)
  rod_speed: 0.10  # скорость движения стержней (1/с)
  initial_position: 1.0  # начальная позиция (0=вставлен, 1=извлечен)
  
  # ПИД-регулятор
  Kp: 0.02  # пропорциональный коэффициент
  Ki: 0.002  # интегральный коэффициент
  Kd: 0.01  # дифференциальный коэффициент
  deadband: 0.1  # порог срабатывания
  
  # Кривая worth
  use_nonlinear_worth: true  # использовать нелинейную S-кривую
  worth_shape: 2.2  # параметр формы кривой

poisoning:
  enabled: false  # включить модель Xe/I отравления
  lambda_I: 2.9e-5  # константа распада I-135 (1/с)
  lambda_Xe: 2.1e-5  # константа распада Xe-135 (1/с)
  sigma_Xe: 2.6e-18  # сечение поглощения Xe-135 (см²)
  gamma_I: 0.061  # выход I-135 на деление
  gamma_Xe: 0.003  # выход Xe-135 на деление
  alpha_xe: -8.0e-6  # коэффициент реактивности Xe

sensors:
  noise_std: 0.0  # стандартное отклонение шума
  delay_steps: 0  # задержка измерений (шаги)
  quantization: null  # квантование измерений (null = нет)

logging:
  record_interval: 1  # записывать каждый N-й шаг
  verbose: false  # подробный вывод

