[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-sim"
version = "2.0.0"
description = "Open reactor-systems simulator with a verified lumped PWR core and a legacy teaching stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "researchim-ai"}
]
keywords = ["nuclear", "reactor", "simulation", "pytorch", "reinforcement-learning", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
gui = [
    "nicegui>=1.4.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "jsonschema>=4.18.0",
    "pytest-cov>=4.1.0",
    "pypdf>=4,<7",
    "black>=23.0.0",
    "ruff>=0.0.290",
    "mypy>=1.5.0",
]

[project.scripts]
atomic-acceptance = "atomic_model_acceptance.__main__:main"
atomic-uncertainty = "atomic_model_uncertainty.__main__:main"
atomic-multiphysics = "atomic_model_multiphysics.__main__:main"
atomic-research = "atomic_model_research.__main__:main"
atomic-training = "atomic_model_training.__main__:main"
atomic-pwr-controlled = "atomic_model_controlled_plant.__main__:main"
atomic-pwr-extended = "atomic_model_plant_extension.__main__:main"
atomic-phase-assessment = "atomic_model_phase_assessment.__main__:main"
atomic-network-initialize = "atomic_model_initialization.__main__:main"
atomic-spatial = "atomic_model_spatial.__main__:main"
atomic-hem-identification = "atomic_model_hem_identification.__main__:main"
atomic-hem-throughflow = "atomic_model_hem_throughflow.__main__:main"
atomic-hem-assessment = "atomic_model_hem_assessment.__main__:main"
atomic-hem-qualified = "atomic_model_hem_qualified.__main__:main"
atomic-hem-system = "atomic_model_hem_system.__main__:main"
atomic-hem-network = "atomic_model_hem_network.__main__:main"
atomic-hem-mixture = "atomic_model_hem_mixture.__main__:main"
atomic-hem-experiment = "atomic_model_hem_validation.__main__:main"
atomic-hem-flow = "atomic_model_hem_flow.__main__:main"
atomic-hem = "atomic_model_hem.__main__:main"
atomic-hybrid-graph = "scripts.hybrid_graph_cli:main"
atomic-model-validate = "atomic_model_validation.__main__:main"
atomic-model-rollouts = "atomic_model_rollouts.__main__:main"
atomic-model-release = "atomic_model_release.__main__:main"
atomic-model-arena = "atomic_model_arena.__main__:main"
atomic-model-agent = "atomic_model_agents.__main__:main"
atomic-model-results = "atomic_model_results.__main__:main"
atomic-model-study = "atomic_model_study.__main__:main"
atomic-sim = "generate_dataset:main"
atomic-experiment = "sdk.experiment:main"
atomic-channel-experiment = "sdk.channel_experiment:main"
atomic-dynamic-experiment = "sdk.dynamic_experiment:main"
atomic-model-reference = "atomic_model_reference.__main__:main"
atomic-model-project-ui = "atomic_model_project_ui.__main__:main"
atomic-model-project = "atomic_model_projects.__main__:main"
atomic-model-pool = "atomic_model_pool.__main__:main"
atomic-model-bench = "atomic_model_bench.__main__:main"
atomic-model-workspace = "atomic_model_workspace.__main__:main"
atomic-model-experiment = "atomic_model_runtime.experiment:main"
atomic-agent-tools = "atomic_agent_tools.__main__:main"
atomic-agent-replay = "agent_envs.replay:main"
atomic-agent-benchmark = "agent_envs.benchmark:main"
atomic-euler-experiment = "sdk.euler_experiment:main"
atomic-network-experiment = "sdk.network_experiment:main"
atomic-circulation-experiment = "sdk.circulation_experiment:main"
atomic-pump-experiment = "sdk.pump_experiment:main"
atomic-valve-experiment = "sdk.pump_experiment:main"
atomic-storage-experiment = "sdk.storage_experiment:main"
atomic-inertial-storage-experiment = "sdk.storage_experiment:main"
atomic-pump-storage-experiment = "sdk.pump_storage_experiment:main"
atomic-check-storage-experiment = "sdk.check_storage_experiment:main"
atomic-exchanger-experiment = "sdk.exchanger_experiment:main"
atomic-coupled-exchanger-experiment = "sdk.coupled_exchanger_experiment:main"
atomic-turbine-experiment = "sdk.turbine_experiment:main"
atomic-steam-cycle-experiment = "sdk.steam_cycle_experiment:main"
atomic-primary-steam-experiment = "sdk.primary_steam_experiment:main"

[project.urls]
Homepage = "https://github.com/researchim-ai/atomic-sim"
Repository = "https://github.com/researchim-ai/atomic-sim"

[tool.setuptools]
py-modules = ["generate_dataset"]
package-dir = {"" = "src", scripts = "scripts", data = "data", scenarios = "scenarios", validation = "validation"}

[tool.setuptools.package-data]
reactor = ["default.yaml"]
atomic_model_acceptance = ["data/motel_2025/*"]
atomic_model_multiphysics = ["data/*.json", "data/*.md"]
atomic_model_phase_assessment = ["data/pool_b274/*"]
atomic_model_plant_extension = ["data/beavrs/*"]
atomic_model_spatial = ["data/*.json"]
atomic_model_hem_assessment = ["data/hiper/*", "data/alamgir/*"]
atomic_model_validation = ["data/nist_tn2294/*"]
atomic_model_runtime = ["presets/*.json"]
atomic_model_release = ["py.typed", "golden/*.json", "golden/project/*.json", "golden/project/scenarios/*.json", "golden/project/policies/*.json", "use_cases.json"]
atomic_model_agents = ["*.pyi", "py.typed"]
atomic_model_contracts = ["py.typed"]
atomic_model_project_ui = ["assets/*.html", "assets/*.css", "assets/*.js"]
data = ["sources.json"]
scenarios = ["*.yaml", "*.json"]
validation = ["*.json", "ai06_hem_experiment_v1/**/*", "ai06_dynamic_data_candidate_v1/*"]

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false
include = [
    "atomic_model_acceptance*",
    "atomic_model_decision*",
    "atomic_model_thermal_agent*",
    "atomic_model_uncertainty*",
    "atomic_model_multiphysics*",
    "atomic_model_research*",
    "atomic_model_training*",
    "atomic_pwr_agent*",
    "reactor*",
    "envs*",
    "dataset_builders*",
    "core*",
    "physics*",
    "components*",
    "plants*",
    "instrumentation*",
    "control*",
    "coupling*",
    "validation*",
    "agent_envs*",
    "atomic_agent_tools*",
    "atomic_model_runtime*",
    "atomic_model_hem*",
    "atomic_model_spatial*",
    "atomic_model_initialization*",
    "atomic_model_phase_assessment*",
    "atomic_model_plant_extension*",
    "atomic_model_controlled_plant*",
    "atomic_model_workspace*",
    "atomic_model_bench*",
    "atomic_model_pool*",
    "atomic_model_projects*",
    "atomic_model_project_ui*",
    "atomic_model_reference*",
    "atomic_model_study*",
    "atomic_model_results*",
    "atomic_model_agents*",
    "atomic_model_arena*",
    "atomic_model_rollouts*",
    "atomic_model_validation*",
    "atomic_model_release*",
    "atomic_model_contracts*",
    "scripts",
    "sdk*",
    "scenarios*",
    "data*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
cache_dir = ".cache/pytest"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "external_integration: requires a configured external transport/MPI runtime and data",
    "hardware_specific: requires declared hardware-specific performance runner",
    "long_running: explicit numerical or legacy workloads excluded from the fast lane",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
cache-dir = ".cache/ruff"
src = ["src"]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "src"
cache_dir = ".cache/mypy"
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

