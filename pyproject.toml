[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-sim"
version = "2.0.0"
description = "Open reactor-systems simulator with a verified lumped PWR core and a legacy teaching stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "researchim-ai"}
]
keywords = ["nuclear", "reactor", "simulation", "pytorch", "reinforcement-learning", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
gui = [
    "nicegui>=1.4.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.290",
    "mypy>=1.5.0",
]

[project.scripts]
atomic-sim = "generate_dataset:main"
atomic-experiment = "sdk.experiment:main"
atomic-channel-experiment = "sdk.channel_experiment:main"
atomic-dynamic-experiment = "sdk.dynamic_experiment:main"
atomic-agent-replay = "agent_envs.replay:main"
atomic-agent-benchmark = "agent_envs.benchmark:main"
atomic-euler-experiment = "sdk.euler_experiment:main"
atomic-network-experiment = "sdk.network_experiment:main"
atomic-circulation-experiment = "sdk.circulation_experiment:main"
atomic-pump-experiment = "sdk.pump_experiment:main"
atomic-valve-experiment = "sdk.pump_experiment:main"
atomic-storage-experiment = "sdk.storage_experiment:main"
atomic-inertial-storage-experiment = "sdk.storage_experiment:main"
atomic-pump-storage-experiment = "sdk.pump_storage_experiment:main"
atomic-check-storage-experiment = "sdk.check_storage_experiment:main"
atomic-exchanger-experiment = "sdk.exchanger_experiment:main"
atomic-coupled-exchanger-experiment = "sdk.coupled_exchanger_experiment:main"
atomic-turbine-experiment = "sdk.turbine_experiment:main"
atomic-steam-cycle-experiment = "sdk.steam_cycle_experiment:main"
atomic-primary-steam-experiment = "sdk.primary_steam_experiment:main"

[project.urls]
Homepage = "https://github.com/researchim-ai/atomic-sim"
Repository = "https://github.com/researchim-ai/atomic-sim"

[tool.setuptools]
py-modules = ["generate_dataset"]

[tool.setuptools.package-data]
data = ["sources.json"]
scenarios = ["*.yaml", "*.json"]
validation = ["*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "reactor*",
    "envs*",
    "dataset_builders*",
    "core*",
    "physics*",
    "components*",
    "plants*",
    "instrumentation*",
    "control*",
    "coupling*",
    "validation*",
    "agent_envs*",
    "sdk*",
    "scenarios*",
    "data*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "external_integration: requires a configured external transport/MPI runtime and data",
    "long_running: explicit numerical or legacy workloads excluded from the fast lane",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

