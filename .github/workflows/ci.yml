name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Run smoke benchmark
      run: |
        python tests/test_simulator.py
    
    - name: Check code quality
      run: |
        pip install ruff black
        ruff check reactor/ --ignore E501
        black --check reactor/ tests/ --line-length 100

  performance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Performance benchmark
      run: |
        python -c "
from reactor import ReactorSimulator
import time
sim = ReactorSimulator()
start = time.time()
history = sim.run(100.0)
elapsed = time.time() - start
steps = len(history['time'])
print(f'Performance: {steps/elapsed:.0f} steps/sec')
assert steps/elapsed > 1000, 'Performance regression!'
        "

