name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_external:
        description: Run external tests on a preconfigured atomic-openmc runner
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run fast portable tests
      run: |
        pytest tests/ -q -m "not external_integration and not long_running" --cov=core --cov=physics --cov=components --cov=plants --cov=sdk --cov=instrumentation --cov-report= --cov-fail-under=0

    - name: Run long numerical and legacy workloads
      run: |
        pytest tests/ -q -m "long_running and not external_integration" --cov=core --cov=physics --cov=components --cov=plants --cov=sdk --cov=instrumentation --cov-append --cov-report=term-missing --cov-fail-under=80
    
    - name: Run smoke benchmark
      run: |
        python tests/test_simulator.py
    
    - name: Check code quality
      run: |
        pip install ruff black
        ruff check reactor/ sdk/ scenarios/ agent_envs/ --ignore E501
        black --check reactor/ tests/ --line-length 100

    - name: Build wheel and import the shared session
      run: |
        pip install build
        python -m build
        python -m pip install --force-reinstall dist/atomic_sim-*.whl
        cd /tmp && python -c "from sdk.api import create_session; from data.catalog import load_sources; from scenarios.session import bundled_scenario; import generate_dataset; plant=create_session('vver'); sources=load_sources(); scenario=bundled_scenario('vver_load_rejection.yaml'); assert sources and scenario['engine']=='vver'; print(plant.passport.model_id, len(sources), scenario['name'], generate_dataset.main)"

    - name: Exercise installed experiment CLI outside checkout
      run: |
        python scripts/verify_wheel.py dist/atomic_sim-*.whl

  external-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_external
    runs-on: [self-hosted, linux, atomic-openmc]
    steps:
    - uses: actions/checkout@v3
    - name: Run real external integration on provisioned runtime
      run: python -m pytest -q -m external_integration

  performance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Performance benchmark
      run: |
        python - <<'PY'
        from reactor import ReactorSimulator
        import time
        sim = ReactorSimulator()
        start = time.time()
        history = sim.run(100.0)
        elapsed = time.time() - start
        steps = len(history['time'])
        print(f'Performance: {steps/elapsed:.0f} steps/sec')
        assert steps/elapsed > 1000, 'Performance regression!'
        PY

