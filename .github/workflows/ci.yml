name: Portable regression

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install -e '.[dev]' build pytest-cov
    - name: Portable regression excludes external, long and hardware lanes
      run: python -m pytest tests/ -q -m "not external_integration and not long_running and not hardware_specific" -p atomic_model_release.pytest_gate --atomic-require-executed --atomic-receipt artifacts/portable_receipt.json
    - name: Current public API lint and canonical input types
      run: |
        ruff check atomic_model_hem_identification tests/test_hem_identification.py scripts/verify_hem_identification_install.py scripts/verify_hem_throughflow_install.py atomic_model_hem_throughflow tests/test_hem_throughflow.py scripts/verify_hem_assessment_install.py scripts/verify_hiper_primary.py atomic_model_hem_assessment tests/test_hem_assessment.py scripts/build_hem_qualified_evidence.py scripts/verify_hem_qualified_install.py atomic_model_hem_qualified tests/test_hem_qualified.py atomic_model_hem_mixture atomic_model_hem_network atomic_model_hem_closures atomic_model_hem_validation atomic_model_hem_system atomic_model_hem_flow atomic_model_hem atomic_model_runtime atomic_model_workspace atomic_model_projects atomic_model_project_ui atomic_model_reference atomic_model_study atomic_model_results atomic_model_agents atomic_model_arena atomic_model_bench atomic_model_pool atomic_model_rollouts atomic_model_validation atomic_model_release atomic_model_contracts tests/test_release_engineering.py tests/test_model_rollouts.py tests/test_rollout_faults.py tests/test_experimental_pipe.py tests/test_hem_equilibrium.py tests/test_hem_workflow.py tests/test_hem_flow.py tests/test_finite_hem_system.py tests/test_finite_hem_workflow.py tests/test_hem_mixture.py tests/test_hem_network.py tests/test_hem_network_reference.py tests/test_hem_network_workflow.py tests/test_hem_closures.py tests/test_hem_validation.py tests/test_hybrid_thermal_graph.py tests/test_hybrid_graph_cli.py scripts/hybrid_thermal_graph.py scripts/hybrid_graph_references.py scripts/hybrid_graph_cli.py scripts/qualify_hybrid_graph.py tests/conftest.py
        python -m mypy --strict --follow-imports=silent atomic_model_contracts atomic_model_release/api_contract.py
    - name: Build and test installed resources outside checkout
      run: |
        python -m build
        python -m atomic_model_release.install_check --wheel dist/atomic_sim-2.0.0-py3-none-any.whl --output artifacts/installed_release
